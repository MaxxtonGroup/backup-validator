# This file is managed by Terraform, please contact devsecops team for changes

# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# This one file is pushed to every repository in the organisation, so it has to fit
# every layout. Two conventions make that work:
#
# 1. Every entry uses `directories` (plural) with globs. A glob only expands to
#    directories that actually contain a manifest, so an entry costs nothing in a
#    repository that has none, and a monorepo gets all of its projects covered
#    without naming them. The `directory` (singular) key does NOT support globbing,
#    which is why an entry pinned to "/" silently matches nothing -- and takes its
#    `ignore` rules down with it -- in any repository without a root manifest.
#
# 2. Every entry groups its security updates. `open-pull-requests-limit: 0` disables
#    version updates but security updates ignore that limit, and they default to one
#    pull request per advisory. Sibling pull requests all rewrite the same lockfile,
#    so merging any one of them conflicts the rest. Grouping collapses them into a
#    single pull request per directory. Majors stay out of the group so that one
#    large migration cannot block every other fix behind it.

version: 2
updates:
  - package-ecosystem: "npm"
    directories: # Locations of package manifests
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: "weekly"
      day: monday
    # Disable version updates, but keep security updates enabled
    open-pull-requests-limit: 0

    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Note this does not stop @angular/cli being bumped as the *ancestor* dependency
      # that carries a fix for a vulnerable transitive package.
      - dependency-name: "@angular/*"
      # Keycloak package depends on they current keycloak version we're running
      - dependency-name: "keycloak-js"
      - dependency-name: "keycloak-angular"

  - package-ecosystem: "docker"
    directories: # Locations of Dockerfiles
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: "weekly"
      day: monday
    # Disable version updates, but keep security updates enabled
    open-pull-requests-limit: 0

    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directories: # Locations of build.gradle files
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: "weekly"
      day: monday
    # Disable version updates, but keep security updates enabled
    open-pull-requests-limit: 0

    groups:
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Here, it ignores all Spring Boot dependencies initially.
    ignore:
      - dependency-name: "org.springframework.boot:*"
    # This doesn't work:
    # # Allows for general updates.
    # versioning-strategy: increase
    # # Is used to specify that only patch updates are allowed for Spring Boot dependencies
    # allow:
    #   - dependency-name: "org.springframework.boot:*"
    #     update-types: ["version-update:semver-patch"]

  - package-ecosystem: "terraform"
    directories: # Locations of .tf files
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: "weekly"
      day: monday
    # Disable version updates, but keep security updates enabled
    open-pull-requests-limit: 0

    groups:
      terraform-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    # Workflows only ever live in .github/workflows, so "/" is always correct here.
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
    # Disable version updates, but keep security updates enabled
    open-pull-requests-limit: 0

    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories: # Locations of requirements.txt files
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: "weekly"
      day: monday
    # Disable version updates, but keep security updates enabled
    open-pull-requests-limit: 0

    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
